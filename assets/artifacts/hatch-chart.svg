<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="Bar chart with three series distinguished by hatch, solid ink and accent fill; illustrative values"><style>
.bg{fill:var(--na-color-bg,#ffffff)}.rz{fill:var(--na-color-bg-raised,#eeeeeb)}.ink{fill:var(--na-color-ink,#1a1a18)}
.mut{fill:var(--na-color-ink-muted,#55534d)}.acc{fill:var(--na-color-accent,#7a2e1c)}.bd{fill:var(--na-color-border,#cfccc3)}
.pbg{fill:var(--na-color-plate-bg,#0b0b0b)}.pbd{fill:var(--na-color-plate-border,#2c2a27)}.pac{fill:var(--na-color-plate-accent,#d06a4e)}
.ln{stroke:var(--na-color-ink,#1a1a18);fill:none}.lm{stroke:var(--na-color-ink-muted,#55534d);fill:none}
.la{stroke:var(--na-color-accent,#7a2e1c);fill:none}.lb{stroke:var(--na-color-border,#cfccc3);fill:none}
.t{font:500 15px SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.ts{font:500 12px SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.tl{font:500 20px SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
</style><defs>
<pattern id="na-hatch-accent" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="2.6" height="9" fill="var(--na-color-accent,#7a2e1c)"/></pattern>
<pattern id="na-hatch-ink" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="2.6" height="9" fill="var(--na-color-ink,#1a1a18)"/></pattern>
</defs><rect class="bg" width="680" height="440"/><line class="ln" x1="60" x2="640" y1="360" y2="360" stroke-width="2.5"/><rect x="80" y="170" width="30" height="190" fill="url(#na-hatch-accent)"/><rect class="ln" x="80" y="170" width="30" height="190" stroke-width="2"/><rect x="114" y="240" width="30" height="120" fill="var(--na-color-ink,#1a1a18)"/><rect class="ln" x="114" y="240" width="30" height="120" stroke-width="2"/><rect x="148" y="290" width="30" height="70" fill="var(--na-color-accent,#7a2e1c)"/><rect class="ln" x="148" y="290" width="30" height="70" stroke-width="2"/><text class="ts mut" x="130" y="384" text-anchor="middle">Q1</text><rect x="220" y="130" width="30" height="230" fill="url(#na-hatch-accent)"/><rect class="ln" x="220" y="130" width="30" height="230" stroke-width="2"/><rect x="254" y="210" width="30" height="150" fill="var(--na-color-ink,#1a1a18)"/><rect class="ln" x="254" y="210" width="30" height="150" stroke-width="2"/><rect x="288" y="260" width="30" height="100" fill="var(--na-color-accent,#7a2e1c)"/><rect class="ln" x="288" y="260" width="30" height="100" stroke-width="2"/><text class="ts mut" x="270" y="384" text-anchor="middle">Q2</text><rect x="360" y="210" width="30" height="150" fill="url(#na-hatch-accent)"/><rect class="ln" x="360" y="210" width="30" height="150" stroke-width="2"/><rect x="394" y="190" width="30" height="170" fill="var(--na-color-ink,#1a1a18)"/><rect class="ln" x="394" y="190" width="30" height="170" stroke-width="2"/><rect x="428" y="220" width="30" height="140" fill="var(--na-color-accent,#7a2e1c)"/><rect class="ln" x="428" y="220" width="30" height="140" stroke-width="2"/><text class="ts mut" x="410" y="384" text-anchor="middle">Q3</text><rect x="500" y="100" width="30" height="260" fill="url(#na-hatch-accent)"/><rect class="ln" x="500" y="100" width="30" height="260" stroke-width="2"/><rect x="534" y="250" width="30" height="110" fill="var(--na-color-ink,#1a1a18)"/><rect class="ln" x="534" y="250" width="30" 