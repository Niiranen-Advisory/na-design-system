<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="Three overlapping boundaries; a marked scenario sits outside all of them"><style>
.bg{fill:var(--na-color-bg,#181110)}.rz{fill:var(--na-color-bg-raised,#241a17)}.ink{fill:var(--na-color-ink,#efe9e6)}
.mut{fill:var(--na-color-ink-muted,#a89f9a)}.acc{fill:var(--na-color-accent,#e07a4f)}.bd{fill:var(--na-color-border,#3a2c27)}
.pbg{fill:var(--na-color-plate-bg,#000000)}.pbd{fill:var(--na-color-plate-border,#262320)}.pac{fill:var(--na-color-plate-accent,#e07a4f)}
.ln{stroke:var(--na-color-ink,#efe9e6);fill:none}.lm{stroke:var(--na-color-ink-muted,#a89f9a);fill:none}
.la{stroke:var(--na-color-accent,#e07a4f);fill:none}.lb{stroke:var(--na-color-border,#3a2c27);fill:none}
.t{font:500 15px SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.ts{font:500 12px SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.tl{font:500 20px SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
</style><defs>
<pattern id="na-hatch-accent" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="2.6" height="9" fill="var(--na-color-accent,#e07a4f)"/></pattern>
<pattern id="na-hatch-ink" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="2.6" height="9" fill="var(--na-color-ink,#efe9e6)"/></pattern>
</defs><rect class="bg" width="680" height="440"/>
<rect x="240" y="110" width="100" height="130" fill="url(#na-hatch-accent)"/>
<rect x="240" y="200" width="200" height="100" fill="url(#na-hatch-accent)"/>
<rect x="140" y="200" width="200" height="40" fill="url(#na-hatch-accent)"/>
<rect class="acc" x="240" y="200" width="100" height="40"/>
<rect class="ln" x="40" y="50" width="300" height="190" stroke-width="2.5"/>
<rect class="ln" x="240" y="110" width="300" height="190" stroke-width="2.5"/>
<rect class="ln" x="140" y="200" width="300" height="150" stroke-width="2.5"/>
<text class="t ink" x="52" y="78">user licence</text>
<text class="t ink" x="528" y="138" text-anchor="end">capacity</text>
<text class="t ink" x="152" y="338">pay-as-you-go</text>
<rect class="ln" x="580" y="360" width="20" height="20" stroke-width="2.5"/>
<text class="ts mut" x="590" y="404" text-anchor="middle">your scenario</text></svg>
