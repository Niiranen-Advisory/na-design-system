<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Split field: what the page says versus what the invoice says"><style>
.bg{fill:var(--na-color-bg,#181110)}.rz{fill:var(--na-color-bg-raised,#241a17)}.ink{fill:var(--na-color-ink,#efe9e6)}
.mut{fill:var(--na-color-ink-muted,#a89f9a)}.acc{fill:var(--na-color-accent,#e07a4f)}.bd{fill:var(--na-color-border,#3a2c27)}
.pi{fill:var(--na-color-plate-ink,#ffffff)}.pm{fill:var(--na-color-plate-ink-muted,#9b968d)}.pbg{fill:var(--na-color-plate-bg,#000000)}.pbd{fill:var(--na-color-plate-border,#262320)}.pac{fill:var(--na-color-plate-accent,#e07a4f)}
.ln{stroke:var(--na-color-ink,#efe9e6);fill:none}.lm{stroke:var(--na-color-ink-muted,#a89f9a);fill:none}
.la{stroke:var(--na-color-accent,#e07a4f);fill:none}.lb{stroke:var(--na-color-border,#3a2c27);fill:none}
.tb{font-weight:700;font-size:54px;font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.tm{font-weight:500;font-size:13px;font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.t{font-weight:500;font-size:15px;font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.ts{font-weight:500;font-size:12px;font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}.tl{font-weight:500;font-size:20px;font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
</style><defs>
<pattern id="na-hatch-accent" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="2.6" height="9" fill="var(--na-color-accent,#e07a4f)"/></pattern>
<pattern id="na-hatch-ink" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="2.6" height="9" fill="var(--na-color-ink,#efe9e6)"/></pattern>
</defs><rect class="bg" width="1200" height="630"/>
<polygon class="pbg" points="0,0 814.7,0 585.3,630 0,630"/>
<rect class="pac" x="686" y="-60" width="28" height="750" transform="rotate(20 700 315)"/>
<text class="t" x="48" y="582" style="fill:#fff">what the page says</text>
<text class="t ink" x="1152" y="582" text-anchor="end">what the invoice says</text></svg>
